# Temporary: the collector before and after (gc-faster), both with GC_STATS, on a quiet runner.
name: gcab
on:
  workflow_dispatch:
jobs:
  gcab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: nasm
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm
      - name: Two compilers and the A/B runs
        run: |
          set -e
          make -s build/nihilc1
          W=$RUNNER_TEMP/gc; mkdir -p $W
          git show 29ab0d1:src/runtime.asm > $W/old.asm
          cp src/runtime.asm $W/new.asm
          printf '%s\n' '@ "std:env.nihil";' '@ "std:time.nihil";' \
            'REC = @[code: INT(8); name: STRING(20); price: FLOAT(10); qty: INT(6)];' \
            'N = env_int("N", 1000000);' 'recs = [REC() ; N];' 'i = 0;' \
            '* i < N { recs[i] = REC(i, "item " + $i, .i / 100.0, i % 1000); i = i + 1; }' \
            'k = 0;' '* k < 6000000 { g = "x" + $k; k = k + 1; }' > $W/gcvar.nihil
          for v in old new; do
            nasm -f bin -w-reloc-rel-dword -w-reloc-abs-qword -I src/ -I build/ -DGC_STATS -o $W/$v.bin $W/$v.asm
            { printf 'runtime_bin = ['; od -An -v -tu1 $W/$v.bin | tr -s ' \n' '  ' | sed 's/^ //; s/ $//; s/ /, /g'; printf '\n];\n'; } > src1/runtime_bin.nihil
            build/nihilc1 < /dev/null > /dev/null 2>&1 || true
            printf '%s\n' "$PWD/src1/nihilc1.nihil" | build/nihilc1 > $W/nihilc1-$v && chmod 755 $W/nihilc1-$v
            NIHILC1=$W/nihilc1-$v ./nihilc1.sh $W/gcvar.nihil $W/gcvar-$v
            NIHILC1=$W/nihilc1-$v ./nihilc1.sh bench/tables.nihil $W/tables-$v
          done
          git checkout src1/runtime_bin.nihil
          for round in 1 2 3 4 5; do
            for v in old new; do
              N=1000000 $W/gcvar-$v 2> $W/g.txt > /dev/null
              m=$(grep '^gc' $W/g.txt | tail -3 | sed 's/.*mark \([0-9]*\) us, sweep \([0-9]*\).*/\1 \2/' | sort -n | sed -n 2p)
              N=1000000 SYNCED=10 DIR=$W/data $W/tables-$v 2> $W/t.txt > /dev/null
              big=$(grep '^gc' $W/t.txt | sort -t' ' -k4 -n | tail -1 | sed 's/.*mark \([0-9]*\) us, sweep \([0-9]*\) us.*marked \([0-9]*\).*/mark \1 us, sweep \2 us, \3 blocks/')
              echo "round $round $v: 1M records (2M blocks) median: mark/sweep ${m} us | bench's biggest: $big" | tee -a $W/ab.txt
            done
          done
          { echo '```'; cat $W/ab.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
