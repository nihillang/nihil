# Every push and pull request: both compilers, their equivalence and the
# collector, on a clean Ubuntu (x86_64), the same checks as on the notebook.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install nasm
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm && nasm -v

      - name: Build (stage 0 in assembly, stage 1 in Nihil)
        run: make

      - name: The runtime's bytes in src1/ are src/runtime.asm's
        run: make runtime-check

      - name: Stage 1 from the latest release's compiler is the same as from stage 0
        run: make seedcheck

      - name: Tests, stage 0
        run: make test

      - name: Tests, stage 1
        run: make test1

      - name: Tests, stage 1 without optimizations
        run: make test1-O0

      - name: Stage 0 and stage 1 give identical bytes
        run: make compare

      - name: Fixed point (the compiler compiles itself)
        run: make fixedpoint

      - name: FLOAT and text, checked against Python
        run: make floatcheck

      - name: Garbage collector under pressure
        run: make gcstress

  # what someone without nasm gets: stage 1 from the latest release's compiler, then its tests
  without-nasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: No nasm on this machine
        run: "! command -v nasm"

      - name: Build (stage 1 from a seed)
        run: make && test -x build/nihilc1 && test ! -e build/nihilc

      - name: The runtime assembled by Nihil's own assembler (asm/asm.nihil), no nasm
        run: make runtime-check

      - name: Tests, stage 1
        run: make test1
